name = "henua"
version = "0.1.0"
edition = "hanga-roa"

[dependencies]

# kohau (SQLite via C shim). henua/sqlite_repository.kai imports
# kohau.sqlite directly. Resolved as a git dependency; `kai install`
# fetches the tagged release into the user-level cache
# (~/Library/Caches/kai/pkg/github.com/kaikailang-org/kohau/<sha>/
# on macOS, $XDG_CACHE_HOME/kai/pkg/... on Linux). The shim
# (c/sqlite_shim.{c,h}) travels with the cached repo; the Makefile
# locates it via `kai show` / lockfile rather than assuming a
# sibling checkout.
kohau = { source = "github.com/kaikailang-org/kohau", ref = "v0.1.0" }

# henua's tier1 SQLite-repository fixtures import #[unstable]
# declarations from both kohau.sqlite (low-level surface, v0.1)
# and henua.sqlite_repository (the adapter shipped in this
# package). Opting in here acknowledges the disclosure for the
# in-tree fixtures so the build is warning-free. Downstream
# consumers do the same in their own kai.toml.
[unstable]
henua = true
sqlite = true
kohau = true
sqlite_repository = true
