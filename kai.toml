name = "henua"
version = "0.6.1"
edition = "hanga-roa"
license = "MIT"

[dependencies]

# kohau (SQLite via C shim + cell-wrapped client).
# henua/sqlite_repository.kai imports `kohau.sqlite.client` — the
# cell-wrapped ergonomic surface, NOT the raw `kohau.sqlite` FFI.
# Pinned to kohau v0.5.0, the first release declaring the sqlite
# shim in a `[native]` table: the shim is compiled and linked by
# `kai build` itself, so nothing here passes C flags. Tags before
# v0.4.0 return `Result` in the pre-flip type-argument order and no
# longer type against this adapter.
kohau = { source = "github.com/kaikailang-org/kohau", ref = "v0.5.0" }

# ahu (concurrency / fault-tolerance, layer 2). henua's
# sqlite_repository delegates to kohau's cell-wrapped client, which
# is an `ahu.cell`; the adapter's surface mentions `ahu`-derived
# types (`Pid[SqlMsg]` is a cell mailbox) and the fixtures call
# `ahu.cell.ask` transitively. Declared directly (not relied on
# transitively through kohau) because dependency resolution does not
# thread a dependency's own deps to the consumer's module path.
ahu = { source = "github.com/kaikailang-org/ahu", ref = "v0.2.1" }

# henua's SQLite-repository fixtures import #[unstable] declarations
# from this package's own adapter, from kohau's cell-wrapped client
# and raw FFI, both reached transitively — kohau's client is an ahu
# cell wrapping the FFI. A key is the declaration's module path
# mangled the way the compiler reports it, package name included, so
# an entry silences only the module it names and a bare `sqlite`
# matches nothing. Opting in here acknowledges the disclosure for the
# in-tree fixtures so the build and the linter stay warning-free;
# downstream consumers do the same in their own kai.toml.
[unstable]
henua__sqlite_repository = true
kohau__sqlite = true
kohau__sqlite__client = true
